spring:
  application:
    name: devboard-api

  datasource:
    url: jdbc:mysql://localhost:3306/devboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: test1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 파일 업로드 크기 제한
  servlet:
    multipart:
      # 파일 한 개의 최대 크기
      max-file-size: 5MB

      # 요청 전체의 최대 크기
      max-request-size: 30MB

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

# 채팅 사진 업로드 설정
chat:
  image:
    upload-dir: ./uploads/chat
    max-size: 5242880

# 게시글 이미지 업로드 설정
file:
  upload-dir: uploads/post-images