spring:
  application:
    name: devboard-api

  # 공통 파일 업로드 크기 제한
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

  # JPA 공통 설정
  jpa:
    open-in-view: false

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

# 채팅 이미지 설정
chat:
  image:
    upload-dir: ${CHAT_IMAGE_UPLOAD_DIR:./uploads/chat}
    max-size: 5242880

# 게시글 이미지 설정
file:
  upload-dir: ${POST_IMAGE_UPLOAD_DIR:./uploads/post-images}
