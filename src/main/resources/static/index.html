<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBoard | 게시판</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="/">DevBoard</a>

    <nav id="navMenu">
        <a href="/login.html">로그인</a>
        <a href="/signup.html">회원가입</a>
    </nav>
</header>

<main class="container">
    <section class="welcome">
        <h1>DevBoard</h1>
        <p>개발 지식과 경험을 공유하는 공간입니다.</p>
    </section>

    <section class="board">
        <div class="board-heading">
            <h2>게시글 목록</h2>
            <a id="writeButton" class="button" href="/write.html"
               hidden>글쓰기</a>
        </div>

        <p id="boardMessage" role="status">게시글을 불러오는 중입니다.</p>

        <div id="postList" class="post-list"></div>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
