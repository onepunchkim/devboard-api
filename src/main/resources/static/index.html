<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBoard | 게시판</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/online-presence.css">
</head>
<body>
<header class="header">
    <a class="logo" href="/">DevBoard</a>

    <nav id="navMenu">
        <a href="/login.html">로그인</a>
        <a href="/signup.html">회원가입</a>
    </nav>
</header>

<main class="container">
    <section class="welcome">
        <h1>DevBoard</h1>
        <p>개발 지식과 경험을 공유하는 공간입니다.</p>
    </section>

    <section class="board">
        <div class="board-heading">
            <h2>게시글 목록</h2>
            <a id="writeButton" class="button" href="/write.html"
               hidden>글쓰기</a>
        </div>

        <p id="boardMessage" role="status">게시글을 불러오는 중입니다.</p>

        <div id="postList" class="post-list"></div>

        <!-- 페이지네이션 -->
        <div id="pagination" class="pagination">
            <button id="prevButton" type="button" disabled>
                이전
            </button>

            <span id="pageInfo">1 / 1</span>

            <button id="nextButton" type="button" disabled>
                다음
            </button>
        </div>
    </section>


    <!-- 온라인 회원 목록 -->
    <section class="online-members-panel">
        <div class="online-members-heading">
            <h2>접속 중인 회원</h2>
            <span class="online-indicator"></span>
        </div>

        <p id="online-status" class="online-status">
            온라인 회원을 확인하는 중...
        </p>

        <ul id="online-members" class="online-members-list"></ul>
    </section>

</main>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>
<script src="/js/online-presence.js"></script>
</body>
</html>
