<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 | DevBoard</title>

    <!-- 공통 및 레이아웃 스타일 -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- 기능별 스타일 -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/online-members.css">
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/post-detail.css">

    <!-- 반응형 스타일 -->
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<!-- 상단 헤더 -->
<header class="header">
    <!-- 다른 페이지와 동일한 DevBoard 로고 -->
    <a class="logo" href="/">
        <span class="logo-icon">D</span>
        <span>DevBoard</span>
    </a>

    <!-- 게시글 목록으로 이동 -->
    <nav>
        <a href="/">게시글 목록</a>
    </nav>
</header>

<!-- 게시글 작성 영역 -->
<main class="container write-page">

    <!-- 가운데 정렬을 위한 작성 카드 -->
    <section class="board write-container">

        <!-- 제목과 안내 문구 -->
        <div class="write-heading">
            <h1 id="formTitle">게시글 작성</h1>
            <p>개발 지식과 경험을 공유해 보세요.</p>
        </div>

        <!-- 게시글 작성 및 수정 폼 -->
        <form id="postForm" class="write-form">

            <!-- 게시글 제목 -->
            <div class="form-group">
                <label for="title">제목</label>
                <input
                        id="title"
                        name="title"
                        type="text"
                        maxlength="200"
                        required
                        placeholder="제목을 입력하세요"
                >
            </div>

            <!-- 게시글 내용 -->
            <div class="form-group">
                <label for="content">내용</label>
                <textarea
                        id="content"
                        name="content"
                        rows="12"
                        required
                        placeholder="내용을 입력하세요"
                ></textarea>
            </div>

            <!-- 등록 및 취소 버튼 -->
            <div class="form-actions">
                <button id="submitButton" class="button" type="submit">
                    등록하기
                </button>

                <a class="button secondary" href="/">
                    취소
                </a>
            </div>

            <!-- 처리 결과 메시지 -->
            <p id="formMessage" role="status"></p>

        </form>
    </section>
</main>

<!-- 기존 JavaScript 기능 유지 -->
<script src="/js/api.js"></script>
<script src="/js/write.js"></script>

</body>
</html>
