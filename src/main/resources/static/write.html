<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 | DevBoard</title>

    <!-- 공통 및 레이아웃 스타일 -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- 기능별 스타일 -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/online-members.css">
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/post-detail.css">

    <!-- 반응형 스타일 -->
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<!-- 상단 헤더 -->
<header class="header">
    <a class="logo" href="/">
        <span class="logo-icon">D</span>
        <span>DevBoard</span>
    </a>

    <!-- 게시글 목록으로 이동 -->
    <nav>
        <a href="/">게시글 목록</a>
    </nav>
</header>

<!-- 게시글 작성 및 수정 영역 -->
<main class="container write-page">
    <section class="board write-container">

        <!-- 화면 제목 -->
        <div class="write-heading">
            <h1 id="formTitle">게시글 작성</h1>
            <p>개발 지식과 경험을 공유해 보세요.</p>
        </div>

        <!-- 게시글 작성 및 수정 폼 -->
        <form id="postForm" class="write-form">

            <!-- 게시글 제목 -->
            <div class="form-group">
                <label for="title">제목</label>
                <input
                        id="title"
                        name="title"
                        type="text"
                        maxlength="200"
                        required
                        placeholder="제목을 입력하세요"
                >
            </div>

            <!-- 게시글 내용 -->
            <div class="form-group">
                <label for="content">내용</label>
                <textarea
                        id="content"
                        name="content"
                        rows="12"
                        required
                        placeholder="내용을 입력하세요"
                ></textarea>
            </div>

            <!-- 이미지 선택 영역 -->
            <div class="form-group image-form-group">
                <label for="imageFiles">첨부 이미지</label>

                <!-- 이미지 파일 여러 장 선택 -->
                <input
                        id="imageFiles"
                        name="files"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        multiple
                >

                <!-- 이미지 업로드 안내 -->
                <p class="form-help">
                    JPG, PNG, WEBP 이미지 파일을 선택할 수 있습니다.
                    게시글당 최대 5장, 파일당 최대 5MB까지 지원합니다.
                </p>

                <!-- 새로 선택한 이미지 미리보기 -->
                <div
                        id="imagePreviewList"
                        class="image-preview-list"
                        aria-live="polite"
                ></div>

                <!-- 이미지 선택 관련 메시지 -->
                <p
                        id="imageMessage"
                        class="form-message"
                        role="status"
                ></p>
            </div>

            <!-- 수정 모드에서 기존 이미지 표시 -->
            <div
                    id="existingImageSection"
                    class="form-group"
                    hidden
            >
                <label>등록된 이미지</label>

                <!-- 기존 이미지 목록을 JavaScript로 표시 -->
                <div
                        id="existingImageList"
                        class="image-preview-list"
                ></div>

                <!-- 기존 이미지 삭제 안내 -->
                <p class="form-help">
                    삭제할 이미지를 선택한 뒤 삭제 버튼을 눌러 주세요.
                </p>

                <!-- 기존 이미지 관련 메시지 -->
                <p
                        id="existingImageMessage"
                        class="form-message"
                        role="status"
                ></p>
            </div>

            <!-- 등록 및 취소 버튼 -->
            <div class="form-actions">
                <button
                        id="submitButton"
                        class="button"
                        type="submit"
                >
                    등록하기
                </button>

                <a class="button secondary" href="/">
                    취소
                </a>
            </div>

            <!-- 게시글 처리 결과 메시지 -->
            <p id="formMessage" role="status"></p>

        </form>
    </section>
</main>

<!-- 기존 API 및 게시글 작성 JavaScript 유지 -->
<script src="/js/api.js"></script>
<script src="/js/write.js"></script>

</body>
</html>
