<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 | DevBoard</title>

    <!-- 공통 및 레이아웃 스타일 -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- 기능별 스타일 -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/online-members.css">
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/post-detail.css">

    <!-- 반응형 스타일 -->
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<!-- 상단 헤더 -->
<header class="header">
    <!-- 메인 페이지와 동일한 DevBoard 로고 -->
    <a class="logo" href="/">
        <span class="logo-icon">D</span>
        <span>DevBoard</span>
    </a>

    <!-- 게시글 목록으로 이동 -->
    <nav id="navMenu">
        <a href="/">게시글 목록</a>
    </nav>
</header>

<!-- 메인 콘텐츠 -->
<main class="container">
    <section class="board">

        <!-- 게시글 로딩 및 오류 메시지 -->
        <p id="detailMessage" role="status">
            게시글을 불러오는 중입니다.
        </p>

        <!-- 게시글 상세 -->
        <article id="postDetail" hidden>

            <!-- 게시글 제목 및 작성 정보 -->
            <h1 id="postTitle"></h1>
            <p id="postDate" class="post-date"></p>
            <p id="postAuthor" class="post-author"></p>

            <hr>

            <!-- 게시글 본문 -->
            <div id="postContent" class="post-content"></div>

            <!-- 좋아요 영역 -->
            <div class="like-section">

                <!-- 좋아요 등록 및 취소 버튼 -->
                <button
                        id="likeButton"
                        type="button"
                        class="like-button"
                >
                    <span id="likeIcon" aria-hidden="true">♡</span>
                    <span id="likeText">좋아요</span>
                </button>

                <!-- 좋아요 개수 -->
                <span id="likeCount" aria-live="polite">0</span>
                <span>명이 좋아합니다.</span>

                <!-- 좋아요 요청 결과 및 오류 메시지 -->
                <span
                        id="likeMessage"
                        role="status"
                        aria-live="polite"
                ></span>
            </div>

            <!-- 게시글 작업 버튼 -->
            <div class="post-actions">

                <!-- 게시글 목록으로 이동 -->
                <a class="button" href="/">목록으로</a>

                <!-- 작성자에게만 표시되는 수정 버튼 -->
                <a
                        id="editButton"
                        class="button"
                        href="/write.html"
                        hidden
                >
                    수정
                </a>

                <!-- 작성자에게만 표시되는 삭제 버튼 -->
                <button
                        id="deleteButton"
                        type="button"
                        class="button danger"
                        hidden
                >
                    삭제
                </button>
            </div>
        </article>

        <!-- 댓글 영역 -->
        <section
                id="commentSection"
                class="comment-section"
                hidden
        >

            <!-- 댓글 제목 및 개수 -->
            <h2>댓글 <span id="commentCount">0</span></h2>

            <!-- 댓글 작성 폼: comment-form 클래스를 추가 -->
            <form id="commentForm" class="comment-form">

                <label for="commentContent">댓글 작성</label>

                <!-- 댓글 입력창 -->
                <textarea
                        id="commentContent"
                        name="content"
                        maxlength="1000"
                        placeholder="댓글을 입력해 주세요."
                        required
                ></textarea>

                <!-- 댓글 등록 버튼 및 상태 메시지 -->
                <div class="comment-form-actions">

                    <span
                            id="commentMessage"
                            role="status"
                            aria-live="polite"
                    ></span>

                    <button type="submit" class="button">
                        댓글 등록
                    </button>
                </div>
            </form>

            <!-- 댓글 목록 -->
            <div id="commentList" class="comment-list">
                <p>댓글을 불러오는 중입니다.</p>
            </div>

        </section>
    </section>
</main>

<!-- 기존 JavaScript: 게시글 및 댓글 기능 유지 -->
<script src="/js/api.js"></script>
<script src="/js/post-details.js"></script>

</body>
</html>
