<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 | DevBoard</title>

    <!-- 분리한 CSS가 정상 작동하는지 확인하기 위해 임시 비활성화 -->
    <!-- <link rel="stylesheet" href="/css/style.css"> -->

    <!-- 분리한 공통 및 레이아웃 스타일 -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/layout.css">

    <!-- 분리한 기능별 스타일 -->
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/online-members.css">
    <link rel="stylesheet" href="/css/board.css">
    <link rel="stylesheet" href="/css/post-detail.css">

    <!-- 반응형 스타일은 마지막에 적용 -->
    <link rel="stylesheet" href="/css/responsive.css">

</head>
<body>
<header class="header">
    <a class="logo" href="/">DevBoard</a>
    <nav id="navMenu">
        <a href="/">게시글 목록</a>
    </nav>
</header>

<main class="container">
    <section class="board">
        <p id="detailMessage" role="status">
            게시글을 불러오는 중입니다.
        </p>

        <!-- 게시글 상세 -->
        <article id="postDetail" hidden>
            <h1 id="postTitle"></h1>
            <p id="postDate" class="post-date"></p>
            <p id="postAuthor" class="post-author"></p>

            <hr>

            <div id="postContent" class="post-content"></div>

            <!-- 좋아요 영역: 게시글 내용 바로 아래에 표시 -->
            <div class="like-section">
                <!-- 로그인한 회원이 좋아요를 등록하거나 취소하는 버튼 -->
                <button id="likeButton" type="button" class="like-button">
                    <span id="likeIcon" aria-hidden="true">♡</span>
                    <span id="likeText">좋아요</span>
                </button>

                <!-- 서버에서 조회한 좋아요 개수 -->
                <span id="likeCount" aria-live="polite">0</span>
                <span>명이 좋아합니다.</span>

                <!-- 좋아요 요청 결과 및 오류 메시지 -->
                <span id="likeMessage" role="status" aria-live="polite"></span>
            </div>

            <div class="post-actions">
                <a class="button" href="/">목록으로</a>

                <a id="editButton"
                   class="button"
                   href="/write.html"
                   hidden>
                    수정
                </a>

                <button id="deleteButton"
                        class="button danger"
                        hidden>
                    삭제
                </button>
            </div>
        </article>

        <!-- 댓글 영역 -->
        <section id="commentSection" class="comment-section" hidden>
            <hr>

            <h2>댓글 <span id="commentCount">0</span></h2>

            <!-- 댓글 작성 -->
            <form id="commentForm">
                <label for="commentContent">댓글 작성</label>

                <textarea
                        id="commentContent"
                        name="content"
                        maxlength="1000"
                        placeholder="댓글을 입력해 주세요."
                        required></textarea>

                <div class="comment-form-actions">
                    <span id="commentMessage"
                          role="status"
                          aria-live="polite"></span>

                    <button type="submit" class="button">
                        댓글 등록
                    </button>
                </div>
            </form>

            <!-- 댓글 목록 -->
            <div id="commentList" class="comment-list">
                <p>댓글을 불러오는 중입니다.</p>
            </div>
        </section>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/post-details.js"></script>
</body>
</html>
