<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | DevBoard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
    <a class="logo" href="/">DevBoard</a>
    <nav><a href="/login.html">로그인</a></nav>
</header>

<main class="container">
    <section class="board">
        <h1>회원가입</h1>
        <p>DevBoard의 새로운 회원이 되어 보세요.</p>

        <form id="signupForm">
            <label for="email">이메일</label>
            <input id="email" type="email" required maxlength="100"
                   placeholder="이메일을 입력하세요">

            <label for="nickname">닉네임</label>
            <input id="nickname" type="text" required maxlength="30"
                   placeholder="닉네임을 입력하세요">

            <label for="password">비밀번호</label>
            <input id="password" type="password" required minlength="8"
                   placeholder="비밀번호를 입력하세요">

            <button class="button" type="submit">가입하기</button>
            <p id="message" role="status"></p>
        </form>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
