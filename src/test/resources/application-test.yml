# =====================================================
# DevBoard 통합 테스트 전용 설정
# =====================================================

spring:

  # =====================================================
  # 1. 테스트 전용 데이터베이스
  # =====================================================
  datasource:

    # 개발 DB와 테스트 DB를 분리한다.
    url: jdbc:mysql://localhost:3306/devboard_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8

    # 환경변수를 사용하여 DB 접속 정보를 관리한다.
    username: root
    password: test1234

    driver-class-name: com.mysql.cj.jdbc.Driver

  # =====================================================
  # 2. JPA 및 Hibernate 설정
  # =====================================================
  jpa:
    hibernate:

      # 테스트 컨텍스트 시작 시 테이블 재생성
      # 종료 시에는 테이블을 삭제하지 않는다.
      # create-drop으로 인한 종료 시 스키마 삭제 충돌 방지
      ddl-auto: create

    # 영속성 컨텍스트를 요청 종료까지 유지하지 않는다.
    open-in-view: false

    properties:
      hibernate:

        # SQL을 읽기 좋은 형태로 출력한다.
        format_sql: true

# =====================================================
# 3. 테스트 로그 설정
# =====================================================
logging:
  level:

    # Hibernate가 실행하는 SQL 확인
    org.hibernate.SQL: DEBUG

# =====================================================
# 4. 게시글 이미지 테스트 저장 경로
# =====================================================
file:

  # 개발 환경의 이미지 저장 경로와 분리한다.
  upload-dir: ./build/test-uploads/post-images

# =====================================================
# 5. 채팅 이미지 테스트 저장 경로
# =====================================================
chat:
  image:

    # 실제 채팅 이미지와 테스트 이미지를 분리한다.
    upload-dir: ./build/test-uploads/chat

    # 이미지 최대 크기: 5MB
    max-size: 5242880